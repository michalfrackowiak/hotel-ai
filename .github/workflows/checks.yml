name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  django:
    name: Django and Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the app image
        run: docker compose build
      - name: Check Django, migrations, and tests
        run: |
          docker compose run --rm --no-deps web sh -ec '
            python manage.py check
            python manage.py makemigrations --check --dry-run
            python manage.py test
          '
      - name: Smoke-test startup, reception, and admin assets
        run: |
          docker compose up --wait --wait-timeout 60
          docker compose exec -T web python manage.py seed_demo
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz/
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -F 'id="start-voice"'
          curl --fail --silent --show-error 'http://127.0.0.1:8080/?lang=pl' | grep -F 'Włącz rozmowę głosową'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/static/reception/chat.js
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/static/reception/voice.js
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/admin/login/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/static/admin/css/base.css
      - name: Print Compose logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down the test stack
        if: always()
        run: docker compose down --volumes

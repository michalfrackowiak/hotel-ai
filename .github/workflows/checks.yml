name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  django:
    name: Django and Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check isolated benchmark safety gates
        run: python -m unittest discover -s scripts -p 'test_benchmark_*.py'
      - name: Check speech queue admission and recovery
        run: python -m unittest discover -s scripts -p 'test_runtime_*.py'
      - name: Check private speech controller inventory
        run: python -m unittest discover -s scripts -p 'test_controller_*.py'
      - name: Build the app image
        run: docker compose build
      - name: Check Django, migrations, and tests
        run: |
          docker compose run --rm --no-deps web sh -ec '
            python manage.py check
            python manage.py makemigrations --check --dry-run
            python manage.py test
            python -m unittest discover -s scripts -p "test_recovery.py"
          '
      - name: Smoke-test startup, reception, and admin assets
        run: |
          docker compose up --wait --wait-timeout 60
          docker compose exec -T web python manage.py seed_demo
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz/
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -F 'id="start-voice"'
          curl --fail --silent --show-error 'http://127.0.0.1:8080/?lang=pl' | grep -F 'Włącz rozmowę głosową'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/static/reception/chat.js
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/static/reception/voice.js
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/admin/login/
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/static/admin/css/base.css
      - name: Check controller projection against Docker
        run: |
          python - <<'PY'
          import subprocess
          from speech_controller.service import Configuration, inventory
          image = subprocess.check_output(["docker", "compose", "images", "-q", "web"], text=True).strip()
          name = "hotel-ai-controller-ci-fixture"
          subprocess.run(["docker", "create", "--name", name, "--network", "none",
                          "--memory", "32m", "--cpus", "0.25", "--read-only", image], check=True)
          try:
              snapshot = inventory(Configuration("x" * 32, "ci-fixture", (name,)))
              assert snapshot["daemon_identity"]["id"]
              assert snapshot["daemon_identity"]["connection"] == "unverified_context"
              item = snapshot["deployments"][0]
              assert item["state"] == "created" and item["health"] == "none"
              assert item["cpu_limit"] == 0.25 and item["memory_mib"] == 32
          finally:
              subprocess.run(["docker", "rm", name], check=True)
          PY
      - name: Check approved Docker start and stop
        run: python scripts/smoke_controller_controls.py
      - name: Check Docker lifecycle switching and rollback
        run: python scripts/smoke_controller_lifecycle.py
      - name: Smoke-test the optional phone service
        env:
          DJANGO_SECRET_KEY: django-insecure-ci-phone-fixture
          HOTEL_TELEPHONY_PUBLIC_BASE_URL: https://phone.example.test
          HOTEL_TWILIO_AUTH_TOKEN: twilio-ci-fixture
        run: |
          docker compose -f compose.yaml -f compose.telephony.yaml up --wait --wait-timeout 60 phone
          curl --fail --silent --show-error http://127.0.0.1:8081/healthz/
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8081/admin/login/)" = 404
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --data 'CallSid=CA00000000000000000000000000000001' http://127.0.0.1:8081/telephony/incoming/)" = 403
      - name: Smoke-test the private server with Piper and Vosk
        env:
          DJANGO_SECRET_KEY: django-insecure-ci-server-fixture
          HOTEL_PORT: "8082"
          HOTEL_SPEECH_TRAFFIC_DB: /app/data/speech-traffic.sqlite3
        run: |
          docker compose run --rm --no-deps web python -m speech_controller.traffic init /app/data/speech-traffic.sqlite3
          docker compose -f compose.yaml -f compose.server.yaml -f compose.piper.yaml -f compose.asr.yaml up --build --wait --wait-timeout 90 web piper asr
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8082/static/admin/css/base.css
          python scripts/smoke_piper.py http://127.0.0.1:8082 --asr
          docker compose exec -T web python scripts/smoke_controller_readiness.py --tts-url http://piper:5000 --stt-url http://asr:5001
      - name: Print Compose logs after a failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.piper.yaml -f compose.asr.yaml logs --no-color
      - name: Tear down the test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

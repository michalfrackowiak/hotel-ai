{% extends "admin/index.html" %}

{% block content %}
{% if workflows %}
  <section class="module" aria-labelledby="workflows-heading">
    <h2 id="workflows-heading">Common workflows</h2>
    {% for title, links in workflows %}
      <h3>{{ title }}</h3>
      <dl>
        {% for label, description, url in links %}
          <dt><a href="{{ url }}">{{ label }}</a></dt>
          <dd>{{ description }}</dd>
        {% endfor %}
      </dl>
    {% endfor %}
  </section>
{% endif %}
{{ block.super }}
{% endblock %}

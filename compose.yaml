services:
  web:
    build: .
    ports:
      - "127.0.0.1:${HOTEL_PORT:-8080}:8000"
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-}"
      BOOKING_API_KEY: "${BOOKING_API_KEY:-}"
      HOTEL_MODEL_API_KEY: "${HOTEL_MODEL_API_KEY:-}"
      HOTEL_MODEL_BASE_URL: "${HOTEL_MODEL_BASE_URL:-https://api.openai.com/v1}"
      HOTEL_OLLAMA_URL: "${HOTEL_OLLAMA_URL:-http://host.docker.internal:11434}"
      HOTEL_OLLAMA_TIMEOUT: "${HOTEL_OLLAMA_TIMEOUT:-30}"
      HOTEL_DEMO_ADMIN_USERNAME: "${HOTEL_DEMO_ADMIN_USERNAME:-}"
      HOTEL_DEMO_ADMIN_PASSWORD: "${HOTEL_DEMO_ADMIN_PASSWORD:-}"
      HOTEL_GOOGLE_GUEST_SIGNIN_ENABLED: "${HOTEL_GOOGLE_GUEST_SIGNIN_ENABLED:-0}"
      HOTEL_GOOGLE_GUEST_HOST: "${HOTEL_GOOGLE_GUEST_HOST:-}"
      HOTEL_GOOGLE_CLIENT_ID: "${HOTEL_GOOGLE_CLIENT_ID:-}"
      HOTEL_PARSER_TRAINING_ENABLED: "${HOTEL_PARSER_TRAINING_ENABLED:-0}"
      HOTEL_SPEECH_HOST_POLICIES: "${HOTEL_SPEECH_HOST_POLICIES:-}"
      HOTEL_SPEECH_ADMISSION_POLICIES: "${HOTEL_SPEECH_ADMISSION_POLICIES:-}"
      HOTEL_SPEECH_CONTROLLER_URL: "${HOTEL_SPEECH_CONTROLLER_URL:-}"
      HOTEL_SPEECH_CONTROLLER_TOKEN: "${HOTEL_SPEECH_CONTROLLER_TOKEN:-}"
      HOTEL_SPEECH_CONTROLLER_HOST: "${HOTEL_SPEECH_CONTROLLER_HOST:-}"
      HOTEL_SPEECH_TRAFFIC_DB: "${HOTEL_SPEECH_TRAFFIC_DB:-}"
      HOTEL_SPEECH_ROUTE_TARGETS: "${HOTEL_SPEECH_ROUTE_TARGETS:-}"
    volumes:
      - hotel-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hotel-data:

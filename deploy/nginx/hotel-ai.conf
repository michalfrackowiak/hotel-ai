limit_req_zone $binary_remote_addr zone=hotel_ai_chat:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=hotel_ai_audio:1m rate=30r/m;

server {
    listen 80;
    server_name 92.5.19.10;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/hotel-ai-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://92.5.19.10$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 92.5.19.10;

    ssl_certificate /etc/letsencrypt/live/hotel-ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotel-ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_cookie_flags sessionid secure;
    proxy_cookie_flags csrftoken secure;

    include /etc/nginx/snippets/hotel-ai-reception.inc;
}
